name: exp
on:
  push:
    branches: [7-helper-provenance]
permissions:
  contents: read
jobs:
  zig:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: |
          for v in 0.15.2 0.16.0; do
            echo "=== zig $v"
            d=$RUNNER_TEMP/zig-$v; mkdir -p $d
            curl -fsSL https://ziglang.org/download/$v/zig-aarch64-linux-$v.tar.xz | tar -xJ -C $d --strip-components=1
            z=$d/zig
            $z cc --version | head -1
            for p in boot/loa-helper.c:boot/initramfs/loa/loa-helper:A tools/src/splash-off/loa-splash-off.c:rootfs-overlay/usr/lib/loa/loa-splash-off:B tools/src/xtouch/loa-xtouch.c:rootfs-overlay/usr/lib/loa/loa-xtouch:C boot/loa-helper.c:rootfs-overlay/usr/lib/loa/loa-helper:D; do
              src=${p%%:*}; r=${p#*:}; tr=${r%%:*}; out=$RUNNER_TEMP/$v-${r##*:}
              $z cc -target aarch64-linux-musl -O2 -static -s -o $out $src
              echo "--- $tr"; ls -l $tr $out | awk '{print $5, $9}'; sha256sum $tr $out | cut -c1-16
              cmp -l $tr $out | wc -l
              readelf -SW $tr | awk '/\]/{print $2,$3,$6}' | head -30 > $RUNNER_TEMP/a; readelf -SW $out | awk '/\]/{print $2,$3,$6}' | head -30 > $RUNNER_TEMP/b; diff $RUNNER_TEMP/a $RUNNER_TEMP/b | head -20
            done
          done
