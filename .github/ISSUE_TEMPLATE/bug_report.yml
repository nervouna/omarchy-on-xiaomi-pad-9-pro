name: Bug report
description: Something in the port, the build or the install tools does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove serial numbers, MAC addresses, keys and other identifiers from logs before you paste them.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did and what went wrong. Log lines (`journalctl`, `dmesg`) and error messages help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The commands or steps that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Part
      options:
        - Boot (stage-1 init, init_boot)
        - Install / repartition / personalize tools
        - Image builder
        - Display, GPU or touch
        - Audio
        - Wi-Fi or Bluetooth
        - Keyboard, cover or Focus Pencil
        - Charging, battery or suspend
        - Omarchy desktop or updates
        - Docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built from (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Tablet and ROM
      description: RAM size and the stock ROM build, for example 12 GB, OS4.0.5.0.XFPCNXM.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: macOS version
      description: For problems with the host scripts.
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. If you know where the cause is, say so.
