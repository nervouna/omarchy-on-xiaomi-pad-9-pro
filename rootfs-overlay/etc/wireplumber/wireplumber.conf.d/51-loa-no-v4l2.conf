# The Qualcomm msm_vidc codec nodes fail V4L2 QUERYCAP and the v4l2 monitor's
# create-device hook never completes, stalling WirePlumber's whole event queue
# (no stream ever gets linked). Cameras need Qualcomm userspace anyway.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
