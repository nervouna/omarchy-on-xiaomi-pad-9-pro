# The desktop runs from loa-desktop.service via seatd, so logind reports the seat
# as "online", never "active"; with seat monitoring WirePlumber then never starts
# the BlueZ monitor (A2DP connect fails with "Protocol not available").
# In WirePlumber 0.5 this is a profile feature, not a setting. Single-user tablet.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
