# LoA: reboot after a panic with a WARM reset, so RAM (and the ramoops console
# in it) survives and the panic log shows up in /sys/fs/pstore on the next boot
# (archived by systemd-pstore to /var/lib/systemd/pstore). The default cold reset
# loses it. Fastboot is unaffected.
w /sys/kernel/reboot/mode - - - - warm
