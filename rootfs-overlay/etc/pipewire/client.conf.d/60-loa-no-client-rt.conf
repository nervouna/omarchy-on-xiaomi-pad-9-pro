# PipeWire clients must not touch realtime settings here. RTKit is unusable
# (PIDFD_GET_PID_NAMESPACE unsupported), and libpipewire-module-rt then leaves
# the process with RLIMIT_RTTIME = 0. Xiaomi's kernel boosts busy UI/render
# threads to RT on its own, so the first boost of e.g. quickshell's "sq0"
# thread hit the 0 us limit -> kernel SIGKILL (posix_cpu_timers_work) ->
# the Omarchy shell died and was relaunched: a black screen for a few seconds.
context.properties = {
    module.rt = false
}
