# shuntian speakers: PCM goes through a FIFO to loa-audio-relay, which feeds the
# stock Qualcomm AGM (AudioReach) playback path in the Android service island.
context.modules = [
  { name = libpipewire-module-pipe-tunnel
    args = {
      tunnel.mode   = sink
      pipe.filename = "/run/loa-audio/speaker.fifo"
      audio.format  = S16LE
      audio.rate    = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      stream.props = {
        node.name        = "loa_speakers"
        node.description = "Speakers"
        media.class      = "Audio/Sink"
        priority.session = 2000
        node.want-driver = true
      }
    }
  }
]
