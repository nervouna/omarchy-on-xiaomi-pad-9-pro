# shuntian built-in mics: loa-mic-relay runs the stock PAL capture
# (handset-dmic-endfire, vendor PAL device 30) into this FIFO while it is read.
context.modules = [
  { name = libpipewire-module-pipe-tunnel
    args = {
      tunnel.mode   = source
      pipe.filename = "/run/loa-audio/mic.fifo"
      audio.format  = S16LE
      audio.rate    = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      stream.props = {
        node.name        = "loa_mic"
        node.description = "Built-in Microphones"
        media.class      = "Audio/Source"
        priority.session = 2000
        node.want-driver = true
      }
    }
  }
]
