# LoA: hci0/bluetoothd come up after login (stock HAL + bridge), so wait for
# bluetoothd instead of Omarchy's ExecCondition skipping the agent for good.
# Enabled for every user (/etc/systemd/user/default.target.wants): skip root's
# manager (serial console, SSH), whose agent would compete for the default.
[Unit]
ConditionUser=!@system
[Service]
ExecCondition=
ExecStartPre=/bin/sh -c 'until systemctl is-active --quiet bluetooth.service; do sleep 2; done'
TimeoutStartSec=infinity
Restart=always
