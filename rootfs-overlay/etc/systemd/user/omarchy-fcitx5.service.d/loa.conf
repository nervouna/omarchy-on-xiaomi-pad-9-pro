# LoA: the user manager starts before Hyprland imports WAYLAND_DISPLAY, so
# Omarchy's ConditionEnvironment would skip fcitx5 for good. Wait instead.
[Unit]
ConditionEnvironment=
[Service]
ExecStartPre=/bin/sh -c 'until systemctl --user show-environment | grep -q "^WAYLAND_DISPLAY="; do sleep 1; done'
TimeoutStartSec=infinity
