# LoA: the Xiaomi keyboard/QMI and memcg drivers log heavily (up to ~50K
# lines/min, unconditional; engineering log 2026-09-27). 500M held only ~5 hours,
# which lost the evidence for spontaneous resets; 2G keeps about a day.
# Sync every 10 s (default 5 min) so the lead-up to a hard reset reaches disk.
[Journal]
SystemMaxUse=2G
SyncIntervalSec=10s
