[Service]
# Adreno 829 via KGSL Mesa (freedreno GL / turnip VK) instead of llvmpipe.
Environment=GBM_ALWAYS_SOFTWARE= LIBGL_ALWAYS_SOFTWARE= GALLIUM_DRIVER=
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/05_loa_mesa_kgsl.json
Environment=LD_LIBRARY_PATH=/opt/omarchy-android/mesa/root/usr/lib LIBGL_DRIVERS_PATH=/opt/omarchy-android/mesa/root/usr/lib/dri GBM_BACKENDS_PATH=/opt/omarchy-android/mesa/root/usr/lib/gbm
Environment=MESA_LOADER_DRIVER_OVERRIDE=kgsl VK_ICD_FILENAMES=/opt/omarchy-android/mesa/freedreno_icd.json
Environment=AQ_DRM_DMA_HEAP=/dev/dma_heap/system AQ_DRM_PREFERRED_ONLY=1 AQ_DRM_FORCE_MODE_ID=1
