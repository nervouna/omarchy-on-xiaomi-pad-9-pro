# Tablet: the power key and the keyboard cover (xiaomi-hall SW_LID) are handled
# by loa-power-key (screen off/on + touch lock). logind's defaults would power
# off on the power key and suspend on lid close.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
