# Device flags for Chromium on the Xiaomi Pad 9 Pro, read by the launcher before
# ~/.config/chromium-flags.conf. Preferences belong in the user file.
# No --enable-features= here: Chromium keeps only the last one it is given, so
# the user file's line would replace ours.

# Native Wayland.
--ozone-platform=wayland
# Chromium 153 enables Vulkan/Skia-Vulkan by default and its Wayland backend
# can't present Vulkan, so render through ANGLE on OpenGL ES (Mesa freedreno
# over KGSL, the same driver Hyprland uses; buffers via GBM).
--use-gl=angle
--use-angle=gl
--disable-features=Vulkan,VulkanFromANGLE,DefaultANGLEVulkan,SkiaGraphite
# Mesa's freedreno is on Chromium's GPU blocklist; GPU raster and zero copy
# are what make scrolling smooth on the Adreno.
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
# Carried over from the PRoot-era flags (/dev/shm is a 3.7G tmpfs here); not
# re-tested without it.
--disable-dev-shm-usage
# Chinese/other input methods (fcitx5) via Wayland text-input-v3.
--enable-wayland-ime
--wayland-text-input-version=3
