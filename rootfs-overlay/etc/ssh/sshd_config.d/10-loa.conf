# SSH is key-only. The tablet is reachable over Wi-Fi and USB, and the omarchy
# user's password (set with passwd) must not be a way in.
#
# Root logs in over the USB cable with the key that tools/apply-overlay.sh
# installs (tools/tssh). To log in as omarchy, add a public key to
# /home/omarchy/.ssh/authorized_keys.
PasswordAuthentication no
KbdInteractiveAuthentication no
