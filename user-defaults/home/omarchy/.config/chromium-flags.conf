# Native Wayland (LoA). Chromium 153 enables Vulkan/Skia-Vulkan by default and
# its Wayland backend can't present Vulkan, so render through ANGLE on OpenGL ES
# (Mesa freedreno over KGSL, the same driver Hyprland uses; buffers via GBM).
--ozone-platform=wayland
--use-gl=angle
--use-angle=gl
--disable-features=Vulkan,VulkanFromANGLE,DefaultANGLEVulkan,SkiaGraphite
--enable-features=TouchpadOverscrollHistoryNavigation
# Chinese/other input methods (fcitx5) via Wayland text-input-v3.
--enable-wayland-ime
--wayland-text-input-version=3
--password-store=basic
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
# The setuid chrome-sandbox works natively (no user namespaces needed), so the
# PRoot-era --no-sandbox / --disable-gpu-sandbox are gone.
--disable-dev-shm-usage
