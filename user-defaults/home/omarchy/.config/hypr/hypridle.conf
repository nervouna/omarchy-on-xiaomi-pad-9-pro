# LoA tablet idle: Omarchy's own idle service runs the screensaver (150 s);
# its lock is pushed out (shell.json idle.lock = 2000000) because the tablet has
# no password / on-screen keyboard. Screen off after 5 min; any input (touch,
# key) wakes it. Power key toggling is handled by loa-power-key.
general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "disable" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "enable" }))'
}
