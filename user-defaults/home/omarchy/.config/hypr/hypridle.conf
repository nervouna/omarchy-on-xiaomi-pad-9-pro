# LoA tablet idle. The steps are in /usr/lib/loa/idle.sh.
#   On battery:        dim to the minimum after 1 min, screen off after 2 min
#                      (loa-sleepd then suspends). No screensaver: the screen is
#                      off before Omarchy's idle service would start it (150 s,
#                      shell.json idle.screensaver), so keep the second timeout
#                      below that.
#   On external power: Omarchy's screensaver, screen off after 5 min.
# Touching the dimmed screen brings the brightness back; a screen that is off
# wakes with the power key, a double tap or the keyboard cover.
# Omarchy's idle lock is disabled (shell.json idle.lock = 0, set by
# tools/overlay-install.sh): the tablet has no password / on-screen keyboard, and
# a lock firing together with a screen-off lights the screen again.
general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 60
    on-timeout = /usr/lib/loa/idle.sh dim
    on-resume = /usr/lib/loa/idle.sh undim
}

listener {
    timeout = 120
    on-timeout = /usr/lib/loa/idle.sh battery-off
    on-resume = /usr/lib/loa/idle.sh on
}

listener {
    timeout = 300
    on-timeout = /usr/lib/loa/idle.sh off
    on-resume = /usr/lib/loa/idle.sh on
}
