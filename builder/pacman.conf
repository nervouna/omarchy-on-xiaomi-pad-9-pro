# pacman configuration used by builder/build-image.sh for both build roots:
# Omarchy's aarch64 stable channel (default/pacman/aarch64/pacman-stable.conf),
# [omarchy] first so its builds (Hyprland, Quickshell, ttfx, ...) win over Arch
# Linux ARM's. The mirrorlist is the build host's: Omarchy's Arch Linux ARM
# snapshot, rootfs-overlay/usr/share/loa/pacman/mirrorlist.
[options]
Architecture = aarch64
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist
