# pacman configuration used by builder/build-image.sh for both build roots.
# The first repository that carries a package wins: Hyprland comes from [extra]
# (built against the Aquamarine version we patch), Omarchy's apps from [omarchy].
[options]
Architecture = aarch64
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch
