AQUAMARINE_TAG=v0.15.1
AQUAMARINE_PKGREL=100
# Omarchy's package signing key (also in rootfs-overlay/usr/share/loa/pacman/).
OMARCHY_KEY_FPR=40DFB630FF42BCFFB047046CF0134EE680CAC571
# ttfx (Omarchy's screensaver text effects; Omarchy ships it x86_64-only).
