# Pinned sources for builder/build-image.sh (sourced as shell).
# Omarchy itself comes from its [omarchy] pacman repo (builder/packages.txt);
# our patches are re-applied by /etc/pacman.d/hooks/95-loa-omarchy.hook.
# Mesa with the KGSL (Android Adreno kernel driver) backend for freedreno/turnip,
# as built by the omarchy-android project.
MESA_REPO=https://github.com/lfdevs/mesa-for-android-container.git
MESA_REV=98f3d6229d61452cef80f8563af7c56ae599dc14
# Aquamarine: the version Omarchy's Hyprland ([omarchy] repo) is built against, plus
# patches/aquamarine-0001-*.patch.
AQUAMARINE_REPO=https://github.com/hyprwm/aquamarine.git
AQUAMARINE_TAG=v0.15.1
AQUAMARINE_PKGREL=100
# Omarchy's package signing key (also in rootfs-overlay/usr/share/loa/pacman/).
OMARCHY_KEY_FPR=40DFB630FF42BCFFB047046CF0134EE680CAC571
